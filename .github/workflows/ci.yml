name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # There is no go.sum to key a cache on, and a build from a cold cache
          # is seconds. Caching here would only add a step that can go stale.
          cache: false

      # The whole point of the dependency rule is that this stays empty. A
      # require block appearing is a design change and should fail the build
      # rather than arrive unnoticed in a diff.
      - name: No external dependencies
        run: |
          if [ -f go.sum ]; then
            echo "go.sum exists, so something was added to the module graph"
            exit 1
          fi
          if grep -qE '^\s*require' go.mod; then
            echo "go.mod has a require block"
            cat go.mod
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test with the race detector
        run: go test ./... -race -count=1

      # Static, which is half of what "one binary" is worth claiming.
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/freya ./cmd/freya
