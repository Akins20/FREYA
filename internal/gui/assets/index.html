<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freya</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 4 L34 12 L34 28 L20 36 L6 28 L6 12 Z" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M14 26 L14 14 L26 14 M14 20 L23 20" fill="none"
              stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">FREYA</span>
    </div>

    <button id="new-chat" class="ghost wide" type="button"
            title="Start a new thread. She keeps what she already knows.">New conversation</button>

    <div class="rail-label">Recent</div>
    <div id="history" class="history"></div>

    <div class="rail-foot">
      <button id="voice" class="ghost" type="button" aria-pressed="false"
              title="Whether she reads her replies out loud">Voice</button>
      <button id="theme" class="ghost" title="Light or dark">Theme</button>
      <span id="conn" class="conn" title="Connection to Freya">connecting</span>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="title">New conversation</div>
      <div id="status"></div>
      <button id="stop" class="ghost stop" type="button" hidden
              title="Cancel what she is doing">Stop</button>
      <button id="inspect" class="ghost" type="button" aria-pressed="true"
              title="What she has on">Activity</button>
    </header>

    <div id="thread" class="thread">
      <div class="empty">
        <svg class="mark big" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 4 L34 12 L34 28 L20 36 L6 28 L6 12 Z" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M14 26 L14 14 L26 14 M14 20 L23 20" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p>Ask her something, or give her something to do.</p>
      </div>
    </div>

    <form id="composer" autocomplete="off">
      <button id="mic" type="button" class="round" aria-label="Talk to her"
              title="Tap and speak — she stops recording when you stop">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Message Freya…"
                aria-label="Message Freya"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20 L20 12 L4 4 L6 12 Z" fill="currentColor"/>
        </svg>
      </button>
    </form>
    <div id="hint">Enter to send · Shift+Enter for a new line · tap the mic and speak</div>
  </main>

  <!-- What she has on. Every panel here is read from the thing that already
       owns it; the window holds no state of its own about any of them. -->
  <aside id="inspector">
    <div class="ins-head">
      <span id="ins-voice" class="pill" title="Microphone and speaker">off</span>
      <span id="ins-cost" class="pill num" title="Spent today"></span>
    </div>
    <div id="ins-model" class="ins-model"></div>
    <div id="panels"></div>
  </aside>

  <div id="confirm-veil" class="veil" hidden>
    <div id="confirm" class="sheet" role="alertdialog" aria-modal="true"
         aria-labelledby="confirm-head">
      <div class="sheet-head">
        <span id="confirm-risk" class="risk"></span>
        <span id="confirm-head">She wants to do this</span>
        <span id="confirm-clock" class="clock"></span>
      </div>
      <pre id="confirm-cmd" class="cmd"></pre>
      <div id="confirm-why" class="why"></div>
      <div id="confirm-effect" class="effect"></div>
      <label id="confirm-typed" class="typed" hidden>
        This cannot be undone. Type <b>yes</b> to allow it.
        <input id="confirm-word" type="text" autocomplete="off" spellcheck="false"
               aria-label="Type yes to allow">
      </label>
      <div class="sheet-foot">
        <button id="confirm-no" class="ghost" type="button">Don't</button>
        <button id="confirm-yes" class="danger" type="button">Allow</button>
      </div>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
